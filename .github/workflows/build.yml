name: Build-OpenWrt-luci-app-frp

on:
  #push:
  workflow_dispatch:
    inputs:
      tag:
        description: '请填写发布Releases的版本号（留空不发布）'
        required: false
        default: ''
      text:
        description: '请填写发布的说明'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TAG: "${{ github.event.inputs.tag }}"
  TZ: Asia/Shanghai
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          # 实测设备架构：10.10.10.1(ipq60xx) = aarch64_cortex-a53；
          # 10.10.10.2(京东云 RE-CP-02, ramips/mt7621) = mipsel_24kc。
          # 两台均用 opkg(.ipk)，无 apk 需求；以下架构按需增删。
          - aarch64_cortex-a53
          - mipsel_24kc
          
        sdk:
          - 22.03.7
          - SNAPSHOT
# 为何22.03.7，高版本24.10.4会增加依赖luci-lua-runtime导致低版本系统装不上ipk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            /opt/openwrt-sdk-${{ matrix.arch }}-${{ matrix.sdk }}
            dl
          key: sdk-${{ matrix.arch }}-${{ matrix.sdk }}
          
      # - name: Overwrite i18n file
      #   run: |
      #     cat > luci-app-frpc/root/etc/uci-defaults/luci-i18n-frpc-zh-cn << 'EOF'
      #     #!/bin/sh
      #     exit 0
      #     EOF

      - name: 强制设置脚本权限
        run: |
          chmod 0755 luci-app-frpc/root/etc/init.d/frpc
          chmod 0755 luci-app-frps/root/etc/init.d/frps
          
      - name: Building packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-frps luci-app-frpc
          #NO_DEFAULT_FEEDS: 1
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          MAKEFLAGS: -j$(nproc)
          V: s

      - name: 校验产物格式
        run: |
          DIR="bin/packages/${{ matrix.arch }}/packages_ci"
          if [ "${{ matrix.sdk }}" = "SNAPSHOT" ]; then
            if [ -z "$(ls "$DIR"/*.apk 2>/dev/null)" ]; then
              echo "::error::SNAPSHOT 分支未生成 .apk 产物，构建可能未启用 apk"
              exit 1
            fi
          else
            if [ -z "$(ls "$DIR"/*.ipk 2>/dev/null)" ]; then
              echo "::error::${{ matrix.sdk }} 未生成 .ipk 产物"
              exit 1
            fi
          fi

      - name: Upload ipk artifacts
        if: ${{ matrix.sdk != 'SNAPSHOT' }}
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-frp-${{ matrix.arch }}-${{ matrix.sdk }}-ipk
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.ipk

      - name: Upload apk artifacts
        if: ${{ matrix.sdk == 'SNAPSHOT' }}
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-frp-${{ matrix.arch }}-${{ matrix.sdk }}-apk
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.apk

      - name: Create compress files
        if: ${{ github.event.inputs.tag != '' }}
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "build_time=$(TZ=UTC-8 date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
          if [ "${{ matrix.sdk }}" = "SNAPSHOT" ]; then
            echo "PKG_SUFFIX=apk" >> "$GITHUB_ENV"
            zip -j luci-app-frp-${{ env.TAG }}-apk.zip bin/packages/${{ matrix.arch }}/packages_ci/*.apk
          else
            echo "PKG_SUFFIX=ipk" >> "$GITHUB_ENV"
            zip -j luci-app-frp-${{ env.TAG }}-ipk.zip bin/packages/${{ matrix.arch }}/packages_ci/*.ipk
          fi

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            body: |

             > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-easytier?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.TAG }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github)

             - 其中 **`*-ipk.zip`** 是 opkg 安装包（用 `22.03.7` SDK 编译），**`*-apk.zip`** 是 OpenWrt 新版 apk 安装包（用 `SNAPSHOT` SDK 编译，apk 在 main/SNAPSHOT 分支默认启用，24.10 仍为 opkg）。注意：不包含二进制可执行文件，可到下面链接下载：
             https://github.com/fatedier/frp/releases

             - **`*.apk` 是OpenWrt新版的APK包** 对于apk包跳过证书安装命令
             `apk add --allow-untrusted luci-app-frpc.apk`

             ${{ github.event.inputs.text }}
           
            tag_name: ${{ env.TAG }}
            files: luci-app-frp-${{ env.TAG }}-${{ env.PKG_SUFFIX }}.zip
 
